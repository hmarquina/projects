name: asesuisa-ai-first

on:
  push:
    paths: ["asesuisa-ai-first/**", ".github/workflows/asesuisa-ci.yml"]
  pull_request:
    paths: ["asesuisa-ai-first/**", ".github/workflows/asesuisa-ci.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: asesuisa-ai-first

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: asesuisa-ai-first/backend/requirements-dev.txt }
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint, tipos y SAST
        working-directory: asesuisa-ai-first/backend
        run: |
          ruff check .
          mypy app
          bandit -q -r app
      - name: Vulnerabilidades de dependencias
        working-directory: asesuisa-ai-first/backend
        run: pip-audit -r requirements.txt
      - name: Pruebas (SQLite)
        working-directory: asesuisa-ai-first/backend
        env: { RUN_ONLINE_TESTS: "1" }
        run: python -m pytest -q
      - name: Gate de evaluación de IA
        working-directory: asesuisa-ai-first/backend
        run: python -m app.ai.evaluation > /dev/null
      - name: Coherencia documentación/código y permisos UI
        run: |
          python scripts/check_docs.py
          python scripts/check_ui_permissions.py

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: control_tower }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d control_tower" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements-dev.txt
      - name: Pruebas contra PostgreSQL real
        working-directory: asesuisa-ai-first/backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/control_tower
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: asesuisa-ai-first/frontend/package-lock.json }
      - working-directory: asesuisa-ai-first/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r backend/requirements.txt
      - working-directory: asesuisa-ai-first/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx playwright-core install --with-deps chromium
      - name: Flujo completo en navegador real
        env:
          DATABASE_URL: sqlite:///./e2e.db
          PIPELINE_DEPENDENCY_AUDIT: "false"
        run: |
          export JWT_SECRET="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          export DEMO_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(18))')"
          cd backend && python -m app.seed && (python -m app &) && sleep 4 && cd ../frontend
          node e2e/demo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: asesuisa-ai-first/frontend/e2e/screenshots }
