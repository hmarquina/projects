[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501"]
"app/ai/artifact_generators.py" = ["E501"]
"app/ai/prompts.py" = ["E501"]
"app/pipeline/*.py" = ["E501"]
"app/routers/pipeline.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
